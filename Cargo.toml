[package]
name = "replica-v3"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled", "backup", "hooks"] }
crc32c = "0.6"
zstd = "0.13"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
ctrlc = "3"

candle-core = "=0.11.0"
candle-nn = "=0.11.0"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
test-support = []
accelerate = ["candle-core/accelerate"]

[[bin]]
name = "replica-test-worker"
path = "tests/support/worker.rs"
required-features = ["test-support"]

[[bin]]
name = "replica-train"
path = "src/train_main.rs"

[[bin]]
name = "replica-check"
path = "src/check_main.rs"
